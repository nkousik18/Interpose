# Local dev services. Postgres is the audit store (docs/INTERPOSE_SCOPING.md Section
# 6.7). Redis (Section 6.8) joins in Phase 2 Day 6 for the HITL ticket queue -- session
# state (risk scores etc.) stays deferred until something actually reads/writes it.
# Containerizing the gateway + a mock upstream for a fuller docker-compose stack is
# still deferred to Phase 2 Day 9 (Helm), per the Day 5 note in docs/ROADMAP.md.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: interpose
      POSTGRES_PASSWORD: interpose_dev
      POSTGRES_DB: interpose
    ports:
      # Host-side 5433, not 5432: this machine already has an unrelated Postgres
      # install listening on 5432 -- left alone rather than touched.
      - "5433:5432"
    volumes:
      - interpose_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interpose -d interpose"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Trace backend for local dev (Phase 2 Day 10, Section 11.8/S3). All-in-one image:
  # OTLP receiver + storage + query UI in one container -- fine for a laptop, not what
  # production runs (a real deployment splits collector/storage/query and usually
  # points at an existing backend the buyer already has, per Section 11.8's "in
  # production, users bring their own backend" note). Only receives traces if the
  # gateway sets OTEL_EXPORTER_ENDPOINT (see .env.example) -- nothing exports here by
  # default. Not deployed into the kind chart yet -- see charts/interpose/README.md's
  # named-gaps table and concepts/27-opentelemetry-and-distributed-tracing.md.
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC receiver

volumes:
  interpose_postgres_data:
