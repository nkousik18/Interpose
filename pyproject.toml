[project]
name = "interpose"
version = "0.1.0"
description = "Audit and policy gateway for MCP"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp[cli]>=1.28.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "redis>=5.0",
    "langgraph>=0.2",
    "groq>=0.11",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
]

[project.scripts]
interpose = "interpose.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interpose"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.22",
]
analytics = [
    "pyspark>=4.2.0",
]
# Dependencies only the demo MCP servers under mcp-servers/ need -- isolated the same
# way as `analytics`, since a bare gateway install has no use for them (Section
# 6.16's module boundary: mcp-servers/ is deliberately separate from src/interpose/).
mcp-servers = [
    "rapidfuzz>=3.10",
    "duckdb>=1.1",
]
# Dependencies only agents/aml-investigator/ needs -- isolated the same way as
# `mcp-servers`, since a bare gateway install has no use for a DuckDB-querying seed
# generator (Section 6.16's module boundary: agents/ is its own component, not part
# of src/interpose/).
agents = [
    "duckdb>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic autogenerates these; hand-formatting each new migration to pass style
# rules isn't a meaningful signal (only correctness of the migration itself is).
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Lets tests/unit/mcp_servers/ import each standalone MCP server's loader.py/
# store.py/models.py as plain top-level modules, the same way each server.py itself
# does when run directly (`python mcp-servers/<name>/src/server.py` puts that
# directory on sys.path) -- without needing __init__.py/package machinery for what's
# meant to be a standalone service's source, not part of the interpose package.
#
# NOTE: both servers' src/ dirs share module names (config.py, models.py) -- fine for
# server.py itself (only one is ever on sys.path at runtime, per the container/process
# it belongs to), but pytest's rootdir-relative import mode means whichever module
# gets imported first here "wins" the name for the rest of the test session. Each
# test file below imports what it needs by its own explicit path via
# importlib/conftest, not bare `import config`, to avoid that collision -- see
# tests/unit/mcp_servers/conftest.py.
pythonpath = [
    "mcp-servers/ofac-sanctions/src",
    "mcp-servers/transaction-graph/src",
    "agents/aml-investigator/src",
]
