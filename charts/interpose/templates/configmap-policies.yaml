# Stage 4 policy pack (interpose.policies.loader.load_policy_pack), shipped as one
# ConfigMap key per file so the mounted directory looks exactly like a local
# policy_dir does. Which pack -- files/policies-{{ .Values.policies.pack }}/*.yaml --
# is chosen by values.yaml's `policies.pack` (see that file's comment for why these
# are checked-in copies, not a live reference to config/policies/ or
# policies/packs/aml/).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "interpose.fullname" . }}-policies
  labels:
    {{- include "interpose.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob (printf "files/policies-%s/*.yaml" .Values.policies.pack) }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
  {{- end }}
