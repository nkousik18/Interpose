{{- if .Values.grafana.enabled }}
# Grafana's own provisioning config (not the dashboard content itself, which is
# configmap-dashboards.yaml) -- tells Grafana where to find a datasource and where to
# look on disk for dashboard JSON to auto-load. Standard Grafana provisioning
# directory layout: /etc/grafana/provisioning/{datasources,dashboards}/*.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "interpose.fullname" . }}-grafana-provisioning
  labels:
    {{- include "interpose.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # Phase 3 Day 15: all four dashboards query Postgres directly (the Spark
      # aggregation job's `agg_*` tables, interpose.analytics.aggregate_telemetry)
      # rather than Prometheus -- there's no Prometheus deployed anywhere in this
      # chart, and nothing exports `/metrics` for one to scrape (Section 11.5's
      # PodMonitor + Prometheus operator remain a named, deferred gap). Section
      # 10.6's own design is Postgres-centric for exactly this data (Spark writes
      # aggregate tables, not metrics), so this isn't a workaround -- it's the
      # documented data flow. See concepts/32-synthetic-telemetry-and-postgres-backed-dashboards.md .
      - name: Postgres
        uid: interpose-postgres
        type: postgres
        access: proxy
        url: "{{ include "interpose.postgresHost" . }}:{{ include "interpose.postgresPort" . }}"
        database: {{ .Values.postgres.database }}
        user: {{ .Values.postgres.user }}
        secureJsonData:
          password: {{ .Values.postgres.password | quote }}
        jsonData:
          sslmode: disable
          postgresVersion: 1600
        isDefault: true
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: interpose
        orgId: 1
        folder: "Interpose"
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
{{- end }}
