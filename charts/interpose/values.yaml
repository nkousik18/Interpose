# Default values for the interpose chart. These lean toward a production shape
# (external Postgres/Redis, no secrets created by the chart) -- values-dev.yaml layers
# on top for a self-contained local kind install. See charts/interpose/README.md for
# what's real today vs. named-and-deferred (Section 11.4/11.5 of the scoping doc is the
# full enterprise spec; this chart builds the slice that something actually exercises).

image:
  repository: interpose
  tag: dev
  pullPolicy: IfNotPresent

# One Deployment. The scoping doc's Section 11.5 describes gateway and control-plane
# as separate Deployments (gateway scaled 2-10x via HPA, control-plane fixed at 1
# replica) -- but Day 7 built the control-plane LangGraph loop as an in-process
# asyncio.Task started at gateway startup (interpose.gateway.app's lifespan), not a
# standalone process. Charting two Deployments from one image would mean one of them
# does nothing; this chart charts what's real. Splitting control-plane into its own
# scalable service, matching Section 11.5 literally, is v0.2 scope (also means
# replicaCount can safely go above 1 today only because there's no per-agent-instance
# session-affinity concern the current design doesn't already handle -- verify this
# assumption again before actually increasing it).
replicaCount: 1

service:
  port: 8000

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

# LLM provider config (interpose.control_plane.llm). groqApiKey here is a dev
# convenience only, gated by secrets.createDev below -- production sets
# secrets.existingSecretName to a Secret an external system (e.g.
# external-secrets-operator syncing AWS Secrets Manager, per Section 11.5) already
# populated with a GROQ_API_KEY key, and the chart never sees the raw value.
llm:
  groqModel: "openai/gpt-oss-20b"
  groqApiKey: ""

secrets:
  # Dev-only escape hatch: chart creates a Secret from the values above. Never enable
  # this against a values file that will be committed with a real key in it -- see
  # values-dev.yaml's own comment on this, and .gitignore's `*.env` coverage which
  # this deliberately does NOT extend to (a values file isn't .env, so don't paste a
  # real key into values-dev.yaml -- pass it with `--set llm.groqApiKey=...` instead).
  createDev: false
  # If set, takes precedence over createDev -- name of a pre-existing Secret in this
  # release's namespace with keys DATABASE_URL, REDIS_URL, GROQ_API_KEY.
  existingSecretName: ""

postgres:
  # true: chart deploys a plain single-replica Postgres Deployment + PVC for local dev
  # (charts/interpose/templates/postgres/) -- not a Bitnami sub-chart. Deliberate: an
  # external chart-repo dependency (version pinning, `helm dependency build` needing
  # network access, upstream breaking changes) buys nothing for a dev-only convenience
  # toggle whose only job is "something answers on 5432 with the right schema" --
  # production never uses this path regardless (RDS, per Section 11.6), so the
  # sub-chart's internal sophistication was never the thing being demonstrated.
  # false: postgres.host/port/database/user/password (or secrets.existingSecretName)
  # point at an already-running instance.
  embedded: true
  host: ""
  port: 5432
  database: interpose
  user: interpose
  password: interpose_dev
  storage: 1Gi

redis:
  # Same embedded-vs-external pattern and reasoning as postgres above.
  embedded: true
  host: ""
  port: 6379

grafana:
  enabled: true
  adminPassword: admin

# Same embedded-vs-external pattern as postgres.embedded/redis.embedded, for the same
# reason: a real production deploy brings its own OTel Collector and Prometheus
# (Section 11.8's "in production, users bring their own backend" philosophy) rather
# than have this chart stand up a demo-grade, single-replica, no-persistent-storage
# pair inside a real cluster. false here (this file's production-leaning defaults);
# values-dev.yaml turns both on for a self-contained kind install.
#
# otelCollector.enabled=true deploys charts/interpose/templates/otel-collector/ (an
# OTel Collector receiving OTLP on :4317, exporting metrics to Prometheus on :8889)
# and points the gateway's OTEL_EXPORTER_ENDPOINT at it
# (interpose.otelExporterEndpoint helper, configmap-app.yaml). If false,
# otelExporterEndpoint below is used instead (a real, operator-supplied external
# collector) -- empty by default, meaning no endpoint at all: tracing/metrics setup
# is skipped entirely (interpose.config.Settings.otel_exporter_endpoint's own
# documented "None means skipped" behavior), matching this chart's behavior before
# this component existed.
otelCollector:
  enabled: false
otelExporterEndpoint: ""

# prometheus.enabled=true deploys charts/interpose/templates/prometheus/ (a
# single-replica Prometheus, static-scrape-configured against the OTel Collector's
# :8889 exporter port -- no Prometheus Operator/PodMonitor CRD, see that ConfigMap's
# own comment for why) and adds it as a second Grafana datasource
# (charts/interpose/templates/grafana/configmap-provisioning.yaml), which Dashboard 1
# (Gateway Health) now queries for real golden-signal metrics instead of the
# Postgres/audit-log approximation earlier Phase 3 days used.
prometheus:
  enabled: false

# ConfigMap contents for Stage 3 routing (interpose.gateway.routing). Empty by
# default -- this chart doesn't deploy any MCP server itself. A gateway with no
# configured upstreams still starts and passes /healthz + /readyz; every /mcp/{name}
# call just 404s as "unknown_server" until an entry exists. `values-dev.yaml`
# populates this with the dev fixture servers (dev/mcp-servers/, scripts/dev-up.sh)
# so local kind installs have real upstreams to route to.
upstreams:
  servers: {}

# Which files/policies-<pack>/ directory the chart's policy ConfigMap is built from
# (interpose.policies.loader.load_policy_pack, Stage 4). "hello-echo" is the Day 9/10
# scaffolding pack (charts/interpose/files/policies/) that proves policy enforcement
# fires at all; "aml" is the real Phase 3 pack (charts/interpose/files/policies-aml/,
# a checked-in copy of policies/packs/aml/ -- Helm's .Files.Glob can't read outside
# the chart directory, so this can't be a symlink or a live reference; keep the two
# in sync by hand, same as files/policies/ vs config/policies/ already are --
# tests/unit/policies/test_chart_policy_sync.py catches drift). scripts/dev-up.sh
# passes `--set policies.pack=aml` when POLICY_PACK=aml is set in its environment
# (interpose demo aml --setup does this automatically).
policies:
  pack: hello-echo

serviceAccount:
  create: true
  name: ""
