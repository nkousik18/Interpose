# Local kind overrides -- what scripts/dev-up.sh installs with
# (`helm install interpose ./charts/interpose -f values-dev.yaml`). Makes the release
# fully self-contained: embedded Postgres/Redis (already the values.yaml default) plus
# a dev-created Secret, so `helm install` alone brings up a healthy stack with no
# external Secret to pre-create first.
#
# Never put a real GROQ_API_KEY in this file -- it's committed to git. Pass it at
# install time instead: `helm install ... -f values-dev.yaml --set llm.groqApiKey=$GROQ_API_KEY`.
# Without it, the control plane's narrative-generation calls fail closed to their
# non-LLM fallback (see concepts/24-narrative-generation-with-a-real-llm.md) -- the
# stack still comes up healthy either way, which is why this isn't a required value.

secrets:
  createDev: true

# Routes /mcp/{name} at the gateway to the dev fixture MCP servers
# (dev/mcp-servers/*.yaml), applied separately by scripts/dev-up.sh -- not part of
# this chart, see dev/mcp-servers/README.md. Cross-namespace-safe Service DNS names
# (<service>.<namespace>.svc.cluster.local) rather than short names, since a values
# file shouldn't assume it's installed into the same namespace the fixtures happen to
# use today.
upstreams:
  servers:
    hello-echo:
      url: "http://hello-echo.interpose-system.svc.cluster.local:9001/mcp"
    ofac-sanctions:
      url: "http://ofac-sanctions.interpose-system.svc.cluster.local:9002/mcp"
    transaction-graph:
      url: "http://transaction-graph.interpose-system.svc.cluster.local:9003/mcp"

grafana:
  # Local-only convenience default -- fine because Grafana here is only reachable via
  # `kubectl port-forward`, never exposed. Do not reuse this value.yaml as a starting
  # point for anything internet-facing.
  adminPassword: admin

# Self-contained kind install gets its own OTel Collector + Prometheus too, same
# reasoning as embedded Postgres/Redis above -- see values.yaml's own comments on
# both for why they default off there (a real deploy brings its own).
otelCollector:
  enabled: true
prometheus:
  enabled: true
